server {
    listen 80;
    listen [::]:80;

    # Замените на имя или IP виртуалки.
    server_name ict.college.local;

    root /var/www/ict-help/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Заголовки безопасности: система работает во внутренней сети колледжа,
    # но от случайного встраивания в чужую страницу защититься стоит.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # WebSocket Reverb: живые уведомления о заявках.
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
    }

    # Загруженные документы лежат в storage/app/private и раздаются только
    # контроллером с проверкой прав — прямой доступ к ним закрыт.
    location ~ ^/(storage/app|\.env|\.git) {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/ict-help.access.log;
    error_log  /var/log/nginx/ict-help.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
